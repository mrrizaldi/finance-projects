name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# api/ dan dashboard/ itu dua project terpisah (lockfile sendiri-sendiri, versi pnpm
# beda), jadi dua job paralel — kalau merah, langsung ketahuan yang mana.
#
# Test integrasi (tests/integration/) SENGAJA gak jalan di sini: dia nembak DB
# Supabase produksi dan nulis data nyata. Jalanin manual: bash scripts/test-integration.sh
jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          # api/ pin packageManager: pnpm@10.32.1 — biar sama persis sama server.
          # Sengaja gak hardcode `version:`, biar pin di package.json yang jadi
          # satu-satunya sumber kebenaran.
          package_json_file: api/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22 # versi minimum yang didukung (CLAUDE.md); server jalan lebih baru
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          # dashboard/ gak pin packageManager — samain sama pnpm global di server
          # (11.10.0). Jangan diturunin ke 10: CI bakal beda dari yang beneran
          # dipakai buat build produksi.
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - env:
          EVENT: ${{ github.event_name }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          BASE_PUSH: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then dasar=$BASE_PR; else dasar=$BASE_PUSH; fi
          case "$dasar" in ""|0000000000000000000000000000000000000000) dasar=HEAD~1 ;; esac
          git cat-file -e "$dasar" 2>/dev/null || dasar=HEAD~1
          berkas=$(git diff --name-only --diff-filter=ACMR "$dasar" HEAD)
          [ -z "$berkas" ] && exit 0
          python3 scripts/cek_komentar.py $berkas
